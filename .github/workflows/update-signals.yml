name: Update signals (AI research)

# Runs the in-repo research agent ONCE a day, ~1 hour before the US market open
# (08:30 America/New_York → the 09:30 ET open). It calls OpenAI with web search,
# refreshes js/live-data.js + data/live.json, commits the result, and sends the
# Telegram brief.
#
# GitHub cron is UTC-only and does not follow US daylight-saving, so we list both
# candidate UTC times (12:30 EDT / 13:30 EST) and a `gate` job lets exactly one of
# them through — the one that is actually 08:30 in New York that day.
#
# Requirements:
#   - Repo secret `matrix` holding an OpenAI API key (Settings → Secrets and
#     variables → Actions). It is exposed to the script as OPENAI_API_KEY below.
#   - For the *scheduled* runs to fire, this workflow must exist on the repo's
#     DEFAULT branch (GitHub only schedules workflows from the default branch).
#     You can always trigger it manually on any branch via "Run workflow".

on:
  schedule:
    - cron: "30 12 * * 1-5"   # 08:30 ET while on EDT (1h before the 09:30 open)
    - cron: "30 13 * * 1-5"   # 08:30 ET while on EST (1h before the 09:30 open)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-signals
  cancel-in-progress: false

jobs:
  # Let only the schedule that lands on 08:30 New York time proceed (manual runs
  # always proceed). This keeps it to a single daily run across DST changes.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=America/New_York date +%H)" = "08" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false (skipping: not 08:30 New York time)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Research latest signals
        env:
          OPENAI_API_KEY: ${{ secrets.matrix }}
        run: node scripts/update-signals.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "matrix-signal-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/live-data.js data/live.json
          if git diff --staged --quiet; then
            echo "No signal changes to commit."
          else
            git commit -m "chore: refresh live signals [skip ci]"
            git push
          fi

      - name: Telegram brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIEF_SESSION: morning
        run: node scripts/telegram-brief.mjs
