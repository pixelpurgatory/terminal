name: Update signals (AI research)

# MANUAL-ONLY. The daily auto news schedule has been removed — this workflow
# runs only when triggered, selected by `mode`:
#   • full — research ALL signals + price + news, commit js/live-data.js +
#     data/live.json (updates the site), then send the Telegram brief.
#     Triggered by the in-terminal FULL UPDATE button or "Run workflow".
#   • news — research price + news only and send the Telegram brief. No commit.
#
# Requirements:
#   - Repo secret `matrix` holding an OpenAI API key (exposed as OPENAI_API_KEY).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = all signals + price + news (updates the site); news = price + news only (Telegram only)"
        type: choice
        options: [full, news]
        default: full

permissions:
  contents: write

concurrency:
  group: update-signals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Research latest signals
        env:
          OPENAI_API_KEY: ${{ secrets.matrix }}
          SIGNAL_MODE: ${{ inputs.mode }}
        run: node scripts/update-signals.mjs

      # Only a FULL update changes the site; a news run is Telegram-only.
      - name: Commit refreshed data
        if: inputs.mode == 'full'
        run: |
          git config user.name "matrix-signal-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/live-data.js data/live.json
          if git diff --staged --quiet; then
            echo "No signal changes to commit."
          else
            git commit -m "chore: refresh live signals [skip ci]"
            git push
          fi

      - name: Telegram brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIEF_SESSION: morning
        run: node scripts/telegram-brief.mjs
